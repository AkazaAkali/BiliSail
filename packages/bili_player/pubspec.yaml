name: bili_player
description: Generic playback contracts and media_kit adapter for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit
      ref: 63b7ea7dd95fc348cecf250df5f54ff87d69d8a9
  media_kit_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit_video
      ref: 63b7ea7dd95fc348cecf250df5f54ff87d69d8a9
  media_kit_libs_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/universal/media_kit_libs_video
      ref: 63b7ea7dd95fc348cecf250df5f54ff87d69d8a9

# Overrides are repeated in the application root: Pub ignores dependency
# overrides from a transitive package. Keep every fork ref in sync.
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit
      ref: 63b7ea7dd95fc348cecf250df5f54ff87d69d8a9
  media_kit_libs_android_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/android/media_kit_libs_android_video
      ref: 63b7ea7dd95fc348cecf250df5f54ff87d69d8a9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
