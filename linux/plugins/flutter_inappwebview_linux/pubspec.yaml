name: flutter_inappwebview_linux
description: Explicitly unavailable Linux WebView adapter for BiliSail QR-only login.
version: 0.1.0-beta.1
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxInAppWebViewPlatform
