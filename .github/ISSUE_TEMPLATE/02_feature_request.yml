name: 功能建议 / Feature request
description: 提出新功能、体验优化或平台适配建议。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！每个 issue 请聚焦一个需求，可使用中文或 English。
        描述实际使用场景和期望效果，有助于讨论方案与优先级；提交建议不代表已确定实现计划。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已查看[使用说明](https://github.com/CKopoer/BiliSail#使用说明)并搜索[已有 issue（含已关闭）](https://github.com/CKopoer/BiliSail/issues?q=is%3Aissue)，未发现相同需求；如有相关记录，会在下方附上链接。
          required: true

  - type: dropdown
    id: platforms
    attributes:
      label: 涉及平台（可选，可多选）
      description: 不限平台可以留空；其他平台可在需求中说明。
      multiple: true
      options:
        - Windows
        - Android
        - macOS

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与现有不便
      description: 你在什么情况下需要这个功能？当前操作有哪些不便？
      placeholder: 当我……时，需要……；目前只能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 描述期望的操作方式与结果；暂时没有具体方案也可以说明想达到的效果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代办法（可选）
      description: 目前是否有其他方式完成？为什么仍希望增加或改进这个功能？

  - type: textarea
    id: references
    attributes:
      label: 参考与补充材料（可选）
      description: 可以附草图、截图、相关 issue 或其他应用的公开链接，并说明希望参考的具体行为。请隐藏个人信息。
